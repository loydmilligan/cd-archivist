[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-archivist"
version = "0.1.0"
description = "Automated CD ripping, visual capture, metadata enrichment, and Raspberry Pi music archival pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["archivist*"]
exclude = ["tests*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Legacy top-level tests reference the deprecated src/cd_archivist package
# (superseded by archivist/ per sprint-1 plan). Ignored until removed.
addopts = "--strict-markers --strict-config --ignore-glob=tests/test_*.py"
norecursedirs = [".git", "build", "dist", "src"]
