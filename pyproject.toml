[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-archivist"
version = "0.1.0"
description = "Automated CD ripping, visual capture, metadata enrichment, and Raspberry Pi music archival pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "requests>=2.31",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "ruff>=0.5",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["archivist*"]
exclude = ["tests*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
norecursedirs = [".git", "build", "dist", "src"]
