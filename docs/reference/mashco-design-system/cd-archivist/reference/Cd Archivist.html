<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>cd-archivist — operator UI · Mash Co.</title>

  <link rel="stylesheet" href="cd-archivist/colors_and_type.css">
  <link rel="stylesheet" href="cd-archivist/cda-styles.css">

  <link rel="icon" type="image/png" sizes="32x32"   href="cd-archivist/brand/cd-a-favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="64x64"   href="cd-archivist/brand/cd-a-favicon-64x64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="cd-archivist/brand/cd-a-favicon-256x256.png">
  <link rel="apple-touch-icon" sizes="180x180" href="cd-archivist/brand/cd-a-apple-touch-180.png">
  <meta name="theme-color" content="#07090c">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="cd-archivist/tweaks-panel.jsx"></script>
  <script type="text/babel" src="cd-archivist/cda-data.jsx"></script>
  <script type="text/babel" src="cd-archivist/cda-chrome.jsx"></script>
  <script type="text/babel" src="cd-archivist/cda-components.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "rightMode": "card",
      "logOpen": false,
      "showThumbs": true
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [focusedId, setFocusedId] = useState("disc-5d2e"); // the expanded review card

      const focusedDisc = DISCS.find(d => d.id === focusedId);

      const byCol = (c) => DISCS.filter(d => d.column === c);

      return (
        <React.Fragment>
          <div className={"cda-app " + (t.rightMode === "off" ? "no-right" : "")}>
            <Header
              rightMode={t.rightMode}
              onRightModeChange={(v) => setTweak("rightMode", v)}
              logOpen={t.logOpen}
              onLogToggle={() => setTweak("logOpen", !t.logOpen)}
              rigStats={RIG}
            />

            <main className="cda-main">
              <div className="cda-board">
                <Column stage="1" label="Capture" lamp="pulp" count={byCol("capture").length}>
                  {byCol("capture").map(d => (
                    <DiscCard key={d.id} disc={d} isFocused={d.id === focusedId}
                              onFocus={() => { setFocusedId(d.id); setTweak("rightMode", "card"); }} />
                  ))}
                </Column>

                <Column stage="2" label="Beets ID" lamp="sky" count={byCol("beets").length}>
                  {byCol("beets").map(d => (
                    <DiscCard key={d.id} disc={d} isFocused={d.id === focusedId}
                              onFocus={() => { setFocusedId(d.id); setTweak("rightMode", "card"); }} />
                  ))}
                </Column>

                <Column stage="3" label="Review" lamp="amber" count={byCol("review").length}>
                  {byCol("review").map(d => (
                    <DiscCard key={d.id} disc={d} isFocused={d.id === focusedId}
                              onFocus={() => { setFocusedId(d.id); setTweak("rightMode", "card"); }} />
                  ))}
                </Column>

                <Column stage="4" label="In library" lamp="moss" count={byCol("library").length}>
                  {byCol("library").map(d => (
                    <DiscCard key={d.id} disc={d} isFocused={d.id === focusedId}
                              onFocus={() => { setFocusedId(d.id); setTweak("rightMode", "card"); }} />
                  ))}
                </Column>
              </div>
            </main>

            {t.rightMode !== "off" ? (
              <RightDrawer
                mode={t.rightMode}
                focusedDisc={focusedDisc}
                rig={RIG}
                status={DRIVE_STATUS}
              />
            ) : null}

            <BottomLog
              open={t.logOpen}
              onToggle={() => setTweak("logOpen", !t.logOpen)}
              lines={DAEMON_LOG}
            />
          </div>

          <TweaksPanel>
            <TweakSection label="Right drawer" />
            <TweakRadio
              label="Mode"
              value={t.rightMode}
              options={["drive", "card", "off"]}
              onChange={(v) => setTweak("rightMode", v)}
            />
            <TweakSection label="Bottom log" />
            <TweakToggle
              label="Open"
              value={t.logOpen}
              onChange={(v) => setTweak("logOpen", v)}
            />
            <p style={{
              margin: "6px 0 0",
              font: "400 11px/1.4 ui-sans-serif,system-ui,sans-serif",
              color: "rgba(41,38,27,0.55)",
            }}>
              The right drawer swaps purpose based on whether a card is focused. "Drive" shows the live rig state when no card is selected; "card" shows the focused disc's rip log + source.json. "Off" gives the kanban full width.
            </p>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
